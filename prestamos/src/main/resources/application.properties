spring.application.name=prestamos
server.port=8092

# Base de datos propia de este servicio (en memoria)
spring.datasource.url=jdbc:h2:mem:prestamos
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

server.error.include-message=always

# Dónde está el servicio de Catálogo
catalogo.url=http://localhost:8081
pedidos.url=http://localhost:8082
libros.url=http://localhost:8091
